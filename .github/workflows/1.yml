name: Build Custom Kernel - MT6765 with ReSukiSU & SUSFS Full Patch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 1
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip libmpc-dev libmpfr-dev libgmp-dev patch

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate ReSukiSU
        working-directory: kernel-source
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Integrate SUSFS & Apply Patches
        working-directory: kernel-source
        run: |
          # 1. Download SUSFS Source (Branch 4.19)
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_source
          
          # 2. Salin file inti ke folder kernel-source
          cp ../susfs_source/kernel/fs/* fs/
          cp ../susfs_source/kernel/include/linux/* include/linux/
          
          # 3. Salin patch ke lokasi tujuan
          # Patch untuk ReSukiSU (KernelSU folder)
          cp ../susfs_source/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch drivers/kernelsu/
          
          # Patch untuk Kernel Root (sesuaikan versi 4.19)
          cp ../susfs_source/kernel_patches/50_add_susfs_in_kernel-4.19.patch ./
          
          # 4. TERAPKAN PATCH (Gunakan --forward agar tidak error jika sudah terpasang)
          echo "Applying ReSukiSU SUSFS Patch..."
          cd drivers/kernelsu && patch -p1 --forward < 10_enable_susfs_for_ksu.patch || echo "Patch KSU skipped/already applied"
          
          echo "Applying Kernel Root SUSFS Patch..."
          cd ../.. && patch -p1 --forward < 50_add_susfs_in_kernel-4.19.patch || echo "Patch Kernel skipped/already applied"

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          export KBUILD_BUILD_USER="AgusTamvan"
          export KBUILD_BUILD_HOST="GusKernel-CI"
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          DEFCONFIG=oppo6765_defconfig
          
          make clean
          make mrproper
          mkdir -p out
          make O=out $DEFCONFIG
          
          # Aktifkan Config (Request Agus)
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e SUSFS
          ./scripts/config --file out/.config -e KSU_SUSFS
          ./scripts/config --file out/.config -e SUSFS_HIDE_KSU
          
          # Jalankan Kompilasi
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-ReSukiSU-SUSFS-Patched
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: kernel-source/build.log

      - name: Cleanup
        if: always()
        run: rm -rf kernel-source/out toolchain
