name: Build Custom Kernel - MT6765 with KSU-Next (Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 1
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip libmpc-dev libmpfr-dev libgmp-dev

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate KernelSU-Next & Manual Patching
        working-directory: kernel-source
        run: |
          # 1. Jalankan setup legacy
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # 2. BYPASS: Matikan pengecekan hooks di Kbuild agar tidak Error Stop
          sed -i 's/$(error -- KernelSU-Next: No hooks were defined/$(warning -- KernelSU-Next: Hook check bypassed/g' drivers/kernelsu/Kbuild

          # 3. PATCH FS/EXEC.C (Menaruh di fungsi do_execve agar variabel tersedia)
          sed -i '/int do_execve(struct filename \*filename,/,/{/ s/{/{\n\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n#ifdef CONFIG_KSU\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n#endif/' fs/exec.c
          
          # 4. PATCH FS/OPEN.C (Menaruh di SYSCALL faccessat)
          sed -i '/SYSCALL_DEFINE3(faccessat,/,/{/ s/{/{\n#ifdef CONFIG_KSU\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif/' fs/open.c

          # 5. Tambahkan KSU ke Makefile utama
          grep -q "obj-y += drivers/kernelsu/" Makefile || echo "obj-y += drivers/kernelsu/" >> Makefile

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          # Identitas Build
          export KBUILD_BUILD_USER="AgusTamvan"
          export KBUILD_BUILD_HOST="GusKernel-CI"
          
          # Setup Toolchain PATH
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Defconfig MT6765
          DEFCONFIG=oppo6765_defconfig
          
          make clean
          make mrproper
          mkdir -p out
          
          make O=out $DEFCONFIG
          
          # Aktifkan KSU melalui config
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_NEXT
          
          # Mulai proses kompilasi
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-KSUNext
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: kernel-source/build.log

      - name: Cleanup Workdir
        if: always()
        run: |
          rm -rf kernel-source/out
          rm -rf toolchain
          echo "Workspace cleaned up."
