name: Build Custom Kernel - MT6765 with KSU-Next (Bypass Check)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 1
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip libmpc-dev libmpfr-dev libgmp-dev

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate KernelSU-Next & Bypass Hook Check
        working-directory: kernel-source
        run: |
          # 1. Jalankan setup legacy
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # 2. BYPASS: Matikan pengecekan hooks di Kbuild KSU-Next agar tidak Error 2
          # Ini akan memaksa build lanjut meskipun script pengecekannya gagal mendeteksi hook
          sed -i 's/$(error -- KernelSU-Next: No hooks were defined/$(warning -- KernelSU-Next: Hook check bypassed/g' drivers/kernelsu/Kbuild

          # 3. Patch Manual (Gunakan pola yang sangat simpel agar peluang berhasil tinggi)
          # Patch fs/exec.c
          sed -i '/search_binary_handler(bprm);/i \	extern int ksu_handle_execveat(int *fd, struct filename **filename, int *flags);\n	ksu_handle_execveat(&fd, &filename, &flags);' fs/exec.c
          
          # Patch fs/open.c
          sed -i '/return do_entry_open(f, inode, open, file);/i \	extern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\n	ksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c

          # 4. Pastikan KSU masuk ke sistem build utama
          grep -q "obj-y += drivers/kernelsu/" Makefile || echo "obj-y += drivers/kernelsu/" >> Makefile

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          export KBUILD_BUILD_USER="AgusTamvan"
          export KBUILD_BUILD_HOST="GusKernel-CI"
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          DEFCONFIG=oppo6765_defconfig
          
          # Membersihkan build lama jika ada
          make clean
          make mrproper
          mkdir -p out
          
          make O=out $DEFCONFIG
          
          # Aktifkan KSU melalui config
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_NEXT
          
          # Mulai Compile (Log disimpan ke build.log)
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload Kernel & Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-KSUNext
          path: |
            kernel-source/out/arch/arm64/boot/Image.gz-dtb
            kernel-source/build.log

      - name: Cleanup
        if: always()
        run: rm -rf kernel-source/out toolchain
