name: Build Custom Kernel - MT6765 with ReSukiSU & SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 1
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip libmpc-dev libmpfr-dev libgmp-dev

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          # Menggunakan GCC yang stabil untuk MT6765
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate ReSukiSU
        working-directory: kernel-source
        run: |
          # Jalankan script integrasi ReSukiSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Integrate SUSFS
        working-directory: kernel-source
        run: |
          # 1. Download SUSFS Source (Branch 4.19)
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs_source
          
          # 2. Salin file inti SUSFS ke kernel source
          cp ../susfs_source/kernel/include/linux/susfs.h include/linux/
          cp ../susfs_source/kernel/fs/susfs.c fs/
          
          # 3. Masukkan ke sistem build fs
          echo "obj-y += susfs.o" >> fs/Makefile
          
          # 4. Tambahkan deklarasi config SUSFS secara manual ke Kconfig fs
          # Jika Kconfig fs tidak bisa di-patch otomatis, kita buatkan entry sederhana
          echo -e 'config SUSFS\n\tbool "SUSFS Support"\n\tdefault y\nconfig KSU_SUSFS\n\tbool "KSU SUSFS Support"\n\tdepends on KSU && SUSFS\n\tdefault y' >> fs/Kconfig

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          # Identitas Build
          export KBUILD_BUILD_USER="AgusTamvan"
          export KBUILD_BUILD_HOST="GusKernel-CI"
          
          # Setup Toolchain PATH
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Defconfig MT6765
          DEFCONFIG=oppo6765_defconfig
          
          make clean
          make mrproper
          mkdir -p out
          make O=out $DEFCONFIG
          
          # Aktifkan ReSukiSU & SUSFS melalui config (Request Agus)
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e SUSFS
          ./scripts/config --file out/.config -e KSU_SUSFS
          
          # Tambahan optimasi hider
          ./scripts/config --file out/.config -e SUSFS_HIDE_KSU
          ./scripts/config --file out/.config -e SUSFS_HIDE_PORT_UDP
          
          # Mulai proses kompilasi
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-ReSukiSU-SUSFS
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: kernel-source/build.log

      - name: Cleanup
        if: always()
        run: |
          rm -rf kernel-source/out
          rm -rf toolchain
          echo "Workspace cleaned up."
