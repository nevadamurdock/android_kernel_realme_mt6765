name: Build Custom Kernel - MT6765 with KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 1
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip libmpc-dev libmpfr-dev libgmp-dev

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate KernelSU-Next & Manual Patching
        working-directory: kernel-source
        run: |
          # Jalankan setup legacy
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # Patch manual hooks untuk mengatasi "No hooks were defined"
          # 1. Patch fs/exec.c (Mencari fungsi search_binary_handler)
          sed -i '/search_binary_handler/i \
          extern int ksu_handle_execveat(int *fd, struct filename **filename, int *flags);\
          ksu_handle_execveat(&fd, &filename, &flags);' fs/exec.c
          
          # 2. Patch fs/open.c (Mencari fungsi do_entry_open atau faccessat target)
          sed -i '/do_entry_open/i \
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\
          ksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c

          # Pastikan KSU masuk ke sistem build utama
          echo "obj-y += drivers/kernelsu/" >> Makefile

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          # Identitas Build
          export KBUILD_BUILD_USER="AgusTamvan"
          export KBUILD_BUILD_HOST="GusKernel-CI"
          
          # Setup Toolchain PATH
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Berdasarkan log kamu, defconfig yang digunakan adalah:
          DEFCONFIG=oppo6765_defconfig
          
          # Bersihkan lingkungan sebelum mulai
          make clean
          make mrproper
          mkdir -p out
          
          # Generate config awal
          make O=out $DEFCONFIG
          
          # Aktifkan KSU-Next melalui scripts/config
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_NEXT
          
          # Mulai proses kompilasi
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: kernel-source/build.log

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-KSUNext
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb

      - name: Cleanup Workdir
        if: always()
        run: |
          rm -rf kernel-source/out
          rm -rf toolchain
          echo "Workspace cleaned up."
