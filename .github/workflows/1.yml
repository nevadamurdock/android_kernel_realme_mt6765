name: Build Custom Kernel - MT6765 with KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 1
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip libmpc-dev libmpfr-dev libgmp-dev

      - name: Download Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate KernelSU-Next & Manual Patching
        working-directory: kernel-source
        run: |
          # Jalankan setup legacy
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          # 1. Patch fs/exec.c (Menyisipkan hook ksu_handle_execveat)
          sed -i '/int do_execveat_common(int fd, struct filename \*filename,/,/{/ s/{/{\n\textern int ksu_handle_execveat(int *fd, struct filename **filename, int *flags);\n\tksu_handle_execveat(&fd, &filename, &flags);/' fs/exec.c
          
          # 2. Patch fs/open.c (Menyisipkan hook ksu_handle_faccessat)
          sed -i '/long do_faccessat(int dfd, const char __user \*filename, int mode)/,/{/ s/{/{\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, &flags);/' fs/open.c

          # Tambahkan KSU ke Makefile utama jika belum ada
          grep -q "obj-y += drivers/kernelsu/" Makefile || echo "obj-y += drivers/kernelsu/" >> Makefile
          
          # VERIFIKASI: Cek apakah patch berhasil masuk ke file
          echo "--- VERIFIKASI PATCH ---"
          grep -q "ksu_handle_execveat" fs/exec.c && echo "Exec Hook: [OK]" || echo "Exec Hook: [FAILED]"
          grep -q "ksu_handle_faccessat" fs/open.c && echo "Open Hook: [OK]" || echo "Open Hook: [FAILED]"
          echo "------------------------"

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          # Identitas Build
          export KBUILD_BUILD_USER="AgusTamvan"
          export KBUILD_BUILD_HOST="GusKernel-CI"
          
          # Setup Toolchain PATH
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Gunakan defconfig oppo6765 sesuai log sebelumnya
          DEFCONFIG=oppo6765_defconfig
          
          make clean
          make mrproper
          mkdir -p out
          
          # Generate config
          make O=out $DEFCONFIG
          
          # Aktifkan KSU & KSU-Next melalui scripts/config
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_NEXT
          
          # Mulai proses kompilasi
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: kernel-source/build.log

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-KSUNext
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb

      - name: Cleanup Workdir
        if: always()
        run: |
          rm -rf kernel-source/out
          rm -rf toolchain
          echo "Workspace cleaned up."
