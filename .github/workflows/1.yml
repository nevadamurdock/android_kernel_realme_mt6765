name: Build Custom Kernel - MT6765 with KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nevadamurdock/android_kernel_realme_mt6765
          fetch-depth: 0
          path: kernel-source

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu git libssl-dev libncurses5-dev python3-pip zip

      - name: Download Toolchain
        run: |
          mkdir toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Integrate KernelSU-Next Legacy
        working-directory: kernel-source
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Start Kernel Compilation
        working-directory: kernel-source
        run: |
          # Setup Path Toolchain
          export PATH=$(pwd)/../toolchain/aarch64-gcc/bin:$(pwd)/../toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Gunakan defconfig yang sesuai di arch/arm64/configs/
          # Ganti 'oppo6765_defconfig' jika nama filenya berbeda
          DEFCONFIG=oppo6765_defconfig
          
          make O=out $DEFCONFIG
          
          # Aktifkan KSU secara otomatis di config jika belum ada
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_NEXT=y" >> out/.config
          
          make -j$(nproc --all) O=out

      - name: Check Build Result
        working-directory: kernel-source
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "Kernel build successful!"
          else
             echo "Kernel build failed!"
             exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-MT6765-KSUNext
          path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
