name: Build Custom Kernel - MT6765

on:
  workflow_dispatch:
  push:
    branches:
      - wip # Sesuaikan dengan branch utama kamu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-aarch64-linux-gnu g++-arm-linux-gnueabi binutils-aarch64-linux-gnu git gnupg gperf libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3-pip

      - name: Download Toolchain
        run: |
          mkdir toolchain
          cd toolchain
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 aarch64-gcc
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm arm-gcc

      - name: Start Kernel Compilation
        run: |
          export PATH=$(pwd)/toolchain/aarch64-gcc/bin:$(pwd)/toolchain/arm-gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Tentukan Defconfig (sesuaikan nama defconfig di arch/arm64/configs/)
          DEFCONFIG=oppo6765_defconfig 
          
          make O=out $DEFCONFIG
          make -j$(nproc --all) O=out

      - name: Check Build Result
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
             echo "Kernel build successful!"
          else
             echo "Kernel build failed!"
             exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Kernel-MT6765
          path: out/arch/arm64/boot/Image.gz-dtb
